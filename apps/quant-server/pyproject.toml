[project]
name = "quant-server"
version = "0.1.0"
description = "Quant System API and Strategy Orchestrator Server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "quant-core",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.9.0",
]

[tool.uv.sources]
quant-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_server"]
