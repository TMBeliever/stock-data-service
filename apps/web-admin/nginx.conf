server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip 压缩支持
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # 1. 静态资源与前端 SPA 路由兜底
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 静态打包资源强缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 2. 智能体流式对话 SSE 专用通道 (核心：禁用缓冲保证终端与打字机实时跳动)
    location /api/v1/agent/chat {
        proxy_pass http://quant-agent:8060/api/v1/agent/chat;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 必须禁用缓冲，防止逐行终端进度卡顿
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # 延长长轮询与耗时运维命令超时限制 (10分钟)
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 3. Quant Agent 智能投研与多端工具中枢
    location /api/v1/agent/ {
        proxy_pass http://quant-agent:8060/api/v1/agent/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 4. AI 大模型网关与流式中枢
    location /api/v1/ai/ {
        proxy_pass http://ai-core:8070/api/v1/ai/;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    # 5. 通用业务与用户中心鉴权 (common-server :8090)
    location /api/v1/auth/ {
        proxy_pass http://common-server:8090/api/v1/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/v1/user/ {
        proxy_pass http://common-server:8090/api/v1/user/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 6. 量化业务中枢与沙箱回测服务 (quant-server :8080)
    location /api/v1/ {
        proxy_pass http://quant-server:8080/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 7. 行情数据中台 (stock-data :8000)
    location /stock/ {
        proxy_pass http://stock-data:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 8. WebSocket 实时盘口行情通道
    location /ws/ {
        proxy_pass http://stock-data:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }
}
