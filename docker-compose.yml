services:
  stock-data:
    build:
      context: packages/stock-data
      dockerfile: Dockerfile
    container_name: stock-data-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - stock_data_storage:/app/data

  quant-server:
    build:
      context: .
      dockerfile: services/quant-server/Dockerfile
    container_name: quant-server-service
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - QUANT_DATA_SERVICE_HTTP=http://stock-data:8000
      - QUANT_DATA_SERVICE_WS=ws://stock-data:8000/ws/market
      - QUANT_ENVIRONMENT=production
    depends_on:
      - stock-data

  common-server:
    build:
      context: services/common-server
      dockerfile: Dockerfile
    container_name: common-server-service
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      - COMMON_ENVIRONMENT=production
    volumes:
      - common_data_storage:/app/data

volumes:
  stock_data_storage:
  common_data_storage:
