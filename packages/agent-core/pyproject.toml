[project]
name = "agent-core"
version = "0.1.0"
description = "Universal Agent Harness & Execution Engine supporting ReAct, Tools, MCP, and Token Governance"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
    "mcp>=1.0.0",
    "ai-core",
]

[tool.uv.sources]
ai-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
