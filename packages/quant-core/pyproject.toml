[project]
name = "quant-core"
version = "0.1.0"
description = "High-performance quant trading engine, factor library, and simulated broker SDK"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.12.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "websockets>=13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
