[project]
name = "stock-data-service"
version = "0.1.0"
description = "Lightweight, high-performance global stock data service for quant analysis and backtesting under 50GB storage limit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "duckdb>=1.1.0",
    "polars>=1.12.0",
    "pyarrow>=17.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "akshare>=1.14.0",
    "yfinance>=0.2.44",
    "apscheduler>=3.10.4",
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "websockets>=13.0",
    "mcp>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "adapters", "storage", "service"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: tests that connect to external live network APIs (AkShare, Yahoo Finance)",
]

