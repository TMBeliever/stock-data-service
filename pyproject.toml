[tool.uv.workspace]
members = [
    "packages/stock-data",
    "packages/quant-core",
    "packages/ai-core",
    "services/quant-server",
    "services/common-server",
]

[project]
name = "quant-workspace"
version = "0.1.0"
description = "Quant System Full-Stack Polyglot Monorepo Workspace"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"


