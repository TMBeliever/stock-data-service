[project]
name = "quant-agent"
version = "0.1.0"
description = "Universal Financial Quant Agent Orchestration Service supporting MCP Tool Calling & Multi-Client Streaming"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "sse-starlette>=2.1.0",
    "mcp>=1.0.0",
    "ai-core",
]

[tool.uv.sources]
ai-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
